services:
  vpn-ui:
    image: ghcr.io/sharky-01/vpn-ui:latest
    container_name: vpn-ui
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./db/:/etc/vpn-ui/
      - ./cert/:/root/cert/
    environment:
      - TZ=UTC
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=true
    tty: true
